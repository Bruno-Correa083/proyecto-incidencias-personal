<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <h1>Registro de Usuario</h1>
        <button type="button" id="btnMenu" class="btnMenu">☰</button>
        <nav class="NavegaMenu">
            <ul class="menu" id="menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="incidencia.html">Incidencia</a></li>
                <li><a href="tecnicos.html">Técnicos</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="dashboard.html">Dashboard</a></li> 
            </ul>
        </nav>
    </header>

    <section>
        <form method="POST">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required value="">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required value="">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirmar Contraseña:</label>
                <input type="password" id="password_confirm" name="password_confirm" required>
            </div>

            <button type="submit">Registrarse</button>
                <a href="index.html"><button type="button">Volver al inicio</button></a>
                <a href="#Sube"><button type="button">↑ Subir</button></a>
        </form>
    </section>
    <section>
        <div class="login-link">
            <p>¿Ya tienes cuenta? <a href="login.html"><button type="button">Inicia sesión aquí</button></a></p>
        </div>
        </section>
   <footer>

</footer>

</body>
</html>
